name: "build"

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build Paper / Bukkit jars
        run: |
          ./gradlew \
            :minimotd-common:test \
            :minimotd-paper:copyJar \
            :minimotd-bukkit:copyJar \
            --configure-on-demand \
            --no-daemon
      - name: Upload jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minimotd-jars
          path: build/libs/*.jar
      - name: Upload common test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: common/build/reports/tests
